    <!-- Script to prevent flash of unstyled theme; default to 'light' as specified -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('nishtha_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (!savedTheme) {
              localStorage.setItem('nishtha_theme', 'light');
            }
          }
        } catch (e) {}
      })();
    </script>
